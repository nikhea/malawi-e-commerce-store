basePath: /api/v1
definitions:
  apperr.Code:
    enum:
    - NOT_FOUND
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - CONFLICT
    - RATE_LIMITED
    - INTERNAL
    type: string
    x-enum-varnames:
    - CodeNotFound
    - CodeValidation
    - CodeUnauthorized
    - CodeForbidden
    - CodeConflict
    - CodeRateLimited
    - CodeInternal
  dto.AddItemRequest:
    properties:
      product_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      qty:
        example: 2
        type: integer
      variant_id:
        type: string
    required:
    - product_id
    type: object
  dto.AddWishlistRequest:
    properties:
      product_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    required:
    - product_id
    type: object
  dto.CreateCategoryRequest:
    properties:
      description:
        example: Everyday essentials
        type: string
      image_url:
        example: https://…/oil.jpg
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
      slug:
        example: cooking-oil
        type: string
    required:
    - name
    type: object
  dto.CreateIntentRequest:
    properties:
      order_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    required:
    - order_id
    type: object
  dto.CreateProductRequest:
    properties:
      category_id:
        type: string
      currency:
        example: MWK
        type: string
      description:
        example: Pure sunflower oil
        type: string
      image_url:
        type: string
      name:
        example: Sunseed Cooking Oil 2L
        type: string
      price_cents:
        example: 12500
        type: integer
      slug:
        example: sunseed-cooking-oil-2l
        type: string
    required:
    - name
    type: object
  dto.CreateReviewRequest:
    properties:
      body:
        example: Lasted the whole month
        type: string
      rating:
        example: 5
        type: integer
      title:
        example: Great oil
        type: string
    required:
    - rating
    type: object
  dto.CreateVariantRequest:
    properties:
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      sku:
        example: OIL-500-001
        type: string
    required:
    - name
    - sku
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      password:
        example: hunter2-secure
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderRefRequest:
    properties:
      order_ref:
        example: order_123
        type: string
    required:
    - order_ref
    type: object
  dto.PasswordForgotRequest:
    properties:
      email:
        example: shop@malawi.mw
        type: string
    required:
    - email
    type: object
  dto.PasswordResetRequest:
    properties:
      new_password:
        example: hunter2-new
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      name:
        example: Aisha Banda
        type: string
      password:
        example: hunter2-secure
        type: string
    required:
    - email
    - password
    type: object
  dto.ReserveLineRequest:
    properties:
      product_id:
        type: string
      qty:
        example: 2
        type: integer
      variant_id:
        type: string
    required:
    - product_id
    - qty
    type: object
  dto.ReserveRequest:
    properties:
      lines:
        items:
          $ref: '#/definitions/dto.ReserveLineRequest'
        type: array
      order_ref:
        example: order_123
        type: string
      ttl_seconds:
        example: 900
        type: integer
    required:
    - lines
    - order_ref
    type: object
  dto.SetQtyRequest:
    properties:
      qty:
        example: 3
        type: integer
    type: object
  dto.SetRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/public.Role'
        example: admin
    required:
    - role
    type: object
  dto.SetStockRequest:
    properties:
      product_id:
        type: string
      qty:
        example: 50
        type: integer
      variant_id:
        type: string
    required:
    - product_id
    type: object
  dto.UpdateCategoryRequest:
    properties:
      clear_parent:
        type: boolean
      description:
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
    type: object
  dto.UpdateProductRequest:
    properties:
      category_id:
        type: string
      clear_category:
        type: boolean
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
    type: object
  dto.UpdateReviewRequest:
    properties:
      body:
        type: string
      rating:
        type: integer
      title:
        type: string
    type: object
  dto.UpdateVariantRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        example: "482914"
        type: string
      email:
        example: shop@malawi.mw
        type: string
    required:
    - code
    - email
    type: object
  public.Cart:
    properties:
      currency:
        example: MWK
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/public.Line'
        type: array
      subtotal_cents:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  public.Category:
    properties:
      created_at:
        type: string
      description:
        example: Everyday essentials
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://res.cloudinary.com/…/oil.jpg
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
      slug:
        example: cooking-oil
        type: string
    type: object
  public.Detail:
    properties:
      product:
        $ref: '#/definitions/public.Product'
      variants:
        items:
          $ref: '#/definitions/public.VariantView'
        type: array
    type: object
  public.Item:
    properties:
      added_at:
        type: string
      product:
        $ref: '#/definitions/public.ProductSummary'
      product_id:
        type: string
    type: object
  public.Line:
    properties:
      currency:
        example: MWK
        type: string
      id:
        type: string
      line_total_cents:
        example: 25000
        type: integer
      name:
        example: Sunseed Cooking Oil 2L
        type: string
      product_id:
        type: string
      qty:
        example: 2
        type: integer
      sku:
        example: OIL-500-001
        type: string
      unit_price_cents:
        example: 12500
        type: integer
      variant_id:
        type: string
    type: object
  public.Order:
    properties:
      created_at:
        type: string
      currency:
        example: MWK
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/public.OrderLine'
        type: array
      status:
        example: pending
        type: string
      subtotal_cents:
        type: integer
      user_id:
        type: string
    type: object
  public.OrderLine:
    properties:
      line_total_cents:
        type: integer
      name:
        type: string
      product_id:
        type: string
      qty:
        type: integer
      sku:
        type: string
      unit_price_cents:
        type: integer
      variant_id:
        type: string
    type: object
  public.Payment:
    properties:
      amount_cents:
        example: 735
        type: integer
      client_secret:
        type: string
      created_at:
        type: string
      currency:
        example: USD
        type: string
      id:
        type: string
      order_amount_cents:
        example: 12500
        type: integer
      order_id:
        type: string
      status:
        example: pending
        type: string
      stripe_intent_id:
        type: string
    type: object
  public.Product:
    properties:
      category_id:
        type: string
      category_name:
        example: Cooking Oil
        type: string
      created_at:
        type: string
      currency:
        example: MWK
        type: string
      description:
        example: Pure sunflower oil
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        example: Sunseed Cooking Oil
        type: string
      price_cents:
        example: 12500
        type: integer
      slug:
        example: sunseed-cooking-oil
        type: string
    type: object
  public.ProductSummary:
    properties:
      currency:
        example: MWK
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        example: Sunseed Cooking Oil 2L
        type: string
      price_cents:
        example: 12500
        type: integer
      slug:
        example: sunseed-cooking-oil-2l
        type: string
    type: object
  public.Review:
    properties:
      author:
        example: Aisha B.
        type: string
      body:
        example: Lasted the whole month
        type: string
      created_at:
        type: string
      id:
        type: string
      product_id:
        type: string
      rating:
        example: 5
        type: integer
      title:
        example: Great oil
        type: string
      user_id:
        type: string
    type: object
  public.Role:
    enum:
    - admin
    - customer
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleCustomer
  public.Stock:
    properties:
      available:
        example: 47
        type: integer
      on_hand:
        example: 50
        type: integer
      product_id:
        type: string
      reserved:
        example: 3
        type: integer
      variant_id:
        type: string
    type: object
  public.Summary:
    properties:
      average:
        example: 4.5
        type: number
      count:
        example: 12
        type: integer
      reviews:
        items:
          $ref: '#/definitions/public.Review'
        type: array
    type: object
  public.TokenPair:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      expires_at:
        type: string
      name:
        example: Aisha Banda
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        example: w8X2...
        type: string
      role:
        example: customer
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  public.User:
    properties:
      created_at:
        type: string
      email:
        example: shop@malawi.mw
        type: string
      email_verified:
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Aisha Banda
        type: string
      role:
        allOf:
        - $ref: '#/definitions/public.Role'
        example: customer
    type: object
  public.Variant:
    properties:
      created_at:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      is_active:
        type: boolean
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      product_id:
        type: string
      sku:
        example: OIL-500-001
        type: string
    type: object
  public.VariantView:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      sku:
        example: OIL-500-001
        type: string
    type: object
  response.ErrorDetail:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/apperr.Code'
        example: NOT_FOUND
      message:
        example: user not found
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorDetail'
    type: object
info:
  contact: {}
  description: Single-storefront e-commerce API (users, catalog, cart, orders, payments).
  title: Malawi E-Commerce Store API
  version: "1.0"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a category (admin)
      tags:
      - admin
  /admin/categories/{id}:
    delete:
      description: Children become roots (SET NULL), they are not deleted.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a category (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Slug is immutable. Pass clear_parent to detach to root.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a category (admin)
      tags:
      - admin
  /admin/categories/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Multipart upload. Queued in River, processed to Cloudinary
        async — answers 202 immediately, image appears once the
        worker finishes. Omit the file entirely if no image.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Image (max 10 MiB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a category image (admin)
      tags:
      - admin
  /admin/inventory/confirm:
    post:
      consumes:
      - application/json
      description: 'Idempotent: confirming twice succeeds.'
      parameters:
      - description: Order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OrderRefRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm an order's holds into sales (admin)
      tags:
      - admin
  /admin/inventory/release:
    post:
      consumes:
      - application/json
      description: 'Idempotent: releasing twice succeeds.'
      parameters:
      - description: Order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OrderRefRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Release an order's holds (admin)
      tags:
      - admin
  /admin/inventory/reserve:
    post:
      consumes:
      - application/json
      description: Holds lines atomically; short lines fail the whole order.
      parameters:
      - description: Reservation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReserveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reserve stock for an order (admin)
      tags:
      - admin
  /admin/inventory/stock:
    get:
      parameters:
      - description: Product ID
        in: query
        name: product_id
        required: true
        type: string
      - description: Variant ID
        in: query
        name: variant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Stock'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read availability (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Stock
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Stock'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set on-hand stock (admin)
      tags:
      - admin
  /admin/products:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a product (admin)
      tags:
      - admin
  /admin/products/{id}:
    delete:
      description: Hard delete — variants cascade. Prefer deactivating.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a product (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Slug is immutable. Pass clear_category to unfile.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
