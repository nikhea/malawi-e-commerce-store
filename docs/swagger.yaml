basePath: /api/v1
definitions:
  apperr.Code:
    enum:
    - NOT_FOUND
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - CONFLICT
    - INTERNAL
    type: string
    x-enum-varnames:
    - CodeNotFound
    - CodeValidation
    - CodeUnauthorized
    - CodeForbidden
    - CodeConflict
    - CodeInternal
  dto.CreateCategoryRequest:
    properties:
      description:
        example: Everyday essentials
        type: string
      image_url:
        example: https://…/oil.jpg
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
      slug:
        example: cooking-oil
        type: string
    required:
    - name
    type: object
  dto.CreateProductRequest:
    properties:
      category_id:
        type: string
      currency:
        example: MWK
        type: string
      description:
        example: Pure sunflower oil
        type: string
      image_url:
        type: string
      name:
        example: Sunseed Cooking Oil 2L
        type: string
      price_cents:
        example: 12500
        type: integer
      slug:
        example: sunseed-cooking-oil-2l
        type: string
    required:
    - name
    type: object
  dto.CreateVariantRequest:
    properties:
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      sku:
        example: OIL-500-001
        type: string
    required:
    - name
    - sku
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      password:
        example: hunter2-secure
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      name:
        example: Aisha Banda
        type: string
      password:
        example: hunter2-secure
        type: string
    required:
    - email
    - password
    type: object
  dto.SetRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/public.Role'
        example: admin
    required:
    - role
    type: object
  dto.UpdateCategoryRequest:
    properties:
      clear_parent:
        type: boolean
      description:
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
    type: object
  dto.UpdateProductRequest:
    properties:
      category_id:
        type: string
      clear_category:
        type: boolean
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
    type: object
  dto.UpdateVariantRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
    type: object
  public.Category:
    properties:
      created_at:
        type: string
      description:
        example: Everyday essentials
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://res.cloudinary.com/…/oil.jpg
        type: string
      name:
        example: Cooking Oil
        type: string
      parent_id:
        type: string
      slug:
        example: cooking-oil
        type: string
    type: object
  public.Detail:
    properties:
      product:
        $ref: '#/definitions/public.Product'
      variants:
        items:
          $ref: '#/definitions/public.VariantView'
        type: array
    type: object
  public.Product:
    properties:
      category_id:
        type: string
      category_name:
        example: Cooking Oil
        type: string
      created_at:
        type: string
      currency:
        example: MWK
        type: string
      description:
        example: Pure sunflower oil
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        example: Sunseed Cooking Oil
        type: string
      price_cents:
        example: 12500
        type: integer
      slug:
        example: sunseed-cooking-oil
        type: string
    type: object
  public.Role:
    enum:
    - admin
    - customer
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleCustomer
  public.TokenPair:
    properties:
      email:
        example: shop@malawi.mw
        type: string
      expires_at:
        type: string
      name:
        example: Aisha Banda
        type: string
      role:
        example: customer
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  public.User:
    properties:
      created_at:
        type: string
      email:
        example: shop@malawi.mw
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Aisha Banda
        type: string
      role:
        allOf:
        - $ref: '#/definitions/public.Role'
        example: customer
    type: object
  public.Variant:
    properties:
      created_at:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      is_active:
        type: boolean
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      product_id:
        type: string
      sku:
        example: OIL-500-001
        type: string
    type: object
  public.VariantView:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      name:
        example: 500ml
        type: string
      price_cents:
        example: 2500
        type: integer
      sku:
        example: OIL-500-001
        type: string
    type: object
  response.ErrorDetail:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/apperr.Code'
        example: NOT_FOUND
      message:
        example: user not found
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorDetail'
    type: object
info:
  contact: {}
  description: Single-storefront e-commerce API (users, catalog, cart, orders, payments).
  title: Malawi E-Commerce Store API
  version: "1.0"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a category (admin)
      tags:
      - admin
  /admin/categories/{id}:
    delete:
      description: Children become roots (SET NULL), they are not deleted.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a category (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Slug is immutable. Pass clear_parent to detach to root.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a category (admin)
      tags:
      - admin
  /admin/categories/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Multipart upload. Queued in River, processed to Cloudinary
        async — answers 202 immediately, image appears once the
        worker finishes. Omit the file entirely if no image.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Image (max 10 MiB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a category image (admin)
      tags:
      - admin
  /admin/products:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a product (admin)
      tags:
      - admin
  /admin/products/{id}:
    delete:
      description: Hard delete — variants cascade. Prefer deactivating.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a product (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Slug is immutable. Pass clear_category to unfile.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a product (admin)
      tags:
      - admin
  /admin/products/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Multipart upload via the River queue (202 immediately).
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Image (max 10 MiB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a product image (admin)
      tags:
      - admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Single-storefront admin op. Requires the admin role.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change a user's role (admin)
      tags:
      - admin
  /admin/variants/{id}:
    delete:
      parameters:
      - description: Variant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a variant (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: product_id and sku are immutable.
      parameters:
      - description: Variant ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateVariantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Variant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a variant (admin)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials and returns a JWT. Errors stay vague on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates the account (customer by default, admin for ADMIN_EMAILS)
        and returns a JWT.
      parameters:
      - description: Signup
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /categories:
    get:
      description: Public storefront taxonomy, flat and ordered by name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/public.Category'
            type: array
      summary: List categories
      tags:
      - categories
  /categories/{id}:
    get:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Category'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get category by ID
      tags:
      - categories
  /categories/slug/{slug}:
    get:
      description: Pretty-URL lookup used by the storefront.
      parameters:
      - description: Category slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Category'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get category by slug
      tags:
      - categories
  /products:
    get:
      description: Lightweight catalog rows (no variants — fetch Detail per product).
      parameters:
      - description: Filter by category
        in: query
        name: category_id
        type: string
      - description: Hide inactive (default true)
        in: query
        name: active_only
        type: boolean
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/public.Product'
            type: array
      summary: List products
      tags:
      - products
  /products/{id}:
    get:
      description: Product + its variants (the storefront product page).
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Detail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get product detail by ID
      tags:
      - products
  /products/{id}/variants:
    get:
      description: Public SKU list for the storefront product page.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/public.Variant'
            type: array
      summary: List a product's variants
      tags:
      - products
    post:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: SKU
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateVariantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/public.Variant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a variant (admin)
      tags:
      - admin
  /products/slug/{slug}:
    get:
      description: Pretty-URL lookup used by the storefront.
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.Detail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get product detail by slug
      tags:
      - products
  /users/{id}:
    get:
      description: Returns one account wrapped in the standard {"data"} envelope.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.User'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get user by ID
      tags:
      - users
  /users/me:
    get:
      description: Reads identity from the JWT (no id parameter, can't spoof others).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/public.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the caller's own account
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: JWT. Prefix with "Bearer ".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
